<!doctype html>
<html lang="ru" class="max-h-screen h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://icons.simai.io" crossorigin />
    <link rel="stylesheet" href="/distr/core/css/core.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIMAI ADMIN — полигон</title>
    <script>
      // The theme and the language, before anything renders. A component
      // resolves its text from the nearest [lang] when it draws and nothing
      // observes it afterwards, so setting the language later would leave every
      // drawn label in the old one. Inline and first for the same reason the
      // theme is: no flash, and no second answer.
      (function () {
        var chosen = {};
        try { chosen = JSON.parse(localStorage.getItem('simai.admin.appearance') || '{}'); } catch (error) { chosen = {}; }
        var lang = chosen.lang === 'en' ? 'en' : 'ru';
        document.documentElement.lang = lang;
        var theme = chosen.theme || 'system';
        var dark = theme === 'dark'
          || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('theme-dark', dark);
        document.documentElement.classList.toggle('theme-light', !dark);
      })();
    </script>
    <script>
      window.SF_BOOT_CONFIG = { icons: { accumulate: true } };
      window.sfPath = '/distr/';
      window.sfSmartPath = '/distr/';
    </script>
    <script>
      // The four Pro components this reference is built on -- sf-table,
      // sf-data-view, sf-property-view and sf-admin-menu -- ship apart from the
      // free Framework and reach the page as a component package of the Loader:
      // it fetches <base>/rule.js before its first scan and loads them from
      // that base. Their rules are gone from the free core, so a page that does
      // not declare this renders nothing. The base is a placeholder here and the
      // build stamps the Pro release id into it, so a Pro republish lands on a
      // path no cache can answer with the previous release's bytes.
      window.SF_BOOT_CONFIG = {
        ...window.SF_BOOT_CONFIG,
        packages: { pro: { base: '/distr-pro/' } },
      };
    </script>
    <script src="/distr/core/js/core.js" data-sf-script="/distr/core/js/core.js"></script>
    <script>
      // DEV ONLY, branch feat/admin-navigation: the free release this page is
      // pinned to does not carry sf-page-header yet, so its rule is declared
      // here and its script is served from the dev runtime. Removed with the
      // repin to the release that carries cl-page-header.
      SF.RuleLoader['cl-page-header'] ??= {
        tags: ['sf-page-header'], type: 'smart', mode: 'smart', js: true,
        relation: [{ name: 'cl-badges' }, { name: 'cl-icon-buttons' }, { name: 'cl-icons' }],
      };
    </script>
  </head>
  <body class="flex h-full">
    <!-- The menu that replaces the admin's top bar: sf-admin-menu answered
         with the navigation port (src/navigation.ts). No items in the markup:
         the rows are the host's. -->
    <aside class="admin-navigation h-full">
      <sf-admin-menu class="h-full" aria-label="Разделы админки"></sf-admin-menu>
    </aside>

    <main class="flex flex-col flex-1 min-w-0 min-h-0">

      <section id="list-section" class="flex flex-col gap-2 p-4 flex-1 min-w-0 min-h-0">
        <!-- The head of the page, now that the admin has no top bar: where the
             page is (from the site), what it is called, how many records it
             holds, its star, and its main action. Theme and language stand in
             the actions until the profile menu takes them. -->
        <sf-page-header id="page-header" heading="Каталог решений" count="—" star="off">
          <sf-breadcrumbs slot="path" aria-label="Где вы находитесь">
            <sf-breadcrumbs-item href="/">simai.ru</sf-breadcrumbs-item>
            <sf-breadcrumbs-item href="/">Данные</sf-breadcrumbs-item>
          </sf-breadcrumbs>
          <span slot="actions" id="appearance"></span>
        </sf-page-header>
        <!-- Empty unless the page is being driven somewhere unusual: an admin
             does not explain itself above its own list, and a polygon under
             «нет доступа» has to say so. -->
        <p id="state" class="color-on-surface-variant m-0 sf-text-1" role="status"></p>

        <!-- The composition Larena serves, and for one reason worth writing
             down. The data view's `toolbar` slot has fallback content of its
             own: a bare «Поиск» input, a «Вид» select and two buttons, raw and
             unstyled, meant to be replaced. A host that also writes
             `toolbar="false"` on its table gets exactly that and nothing else
             — which is what this page did, and what the owner saw. Slotting an
             empty toolbar suppresses the fallback, and the TABLE's own toolbar
             does the work: search, «Фильтр», and saving a filter template. -->
        <sf-data-view
          id="solutions"
          aria-label="Решения">
          <span slot="toolbar"></span>
          <sf-table
            slot="content"
            id="solutions-table"
            table-settings-key="polygon.solutions"
            aria-label="Решения"></sf-table>
          <sf-pagination slot="pagination"></sf-pagination>
        </sf-data-view>
      </section>
    </main>

    <!-- The record panel is not here, and that is the point. A property view
         carrying `panel` is OPEN from the moment it is in the document: the
         drawer portals its content out of the element, so `hidden` on the
         element leaves the panel painted, and the composite has no closed
         state. Its own comment says closing is the host's decision — which
         means the host decides by placing it and removing it. The page creates
         it when the address names a record and removes it when it does not.
         Written down because the first thing a consumer reaches for is
         `hidden`, and it quietly does nothing. -->

    <script type="module" src="/src/polygon.ts"></script>
  </body>
</html>
