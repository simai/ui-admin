<!doctype html>
<html lang="ru" class="theme-dark h-full" data-sf-icon-runtime="bundled-fallback">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>SF Admin Menu Reference</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/distr/core/css/core.css" />
    <link rel="stylesheet" href="/src/navigation-menu-reference.css" />
    <script>
      // The theme and the language, before anything renders. A component
      // resolves its text from the nearest [lang] when it draws and nothing
      // observes it afterwards, so setting the language later would leave every
      // drawn label in the old one. Inline and first for the same reason the
      // theme is: no flash, and no second answer.
      (function () {
        var chosen = {};
        try { chosen = JSON.parse(localStorage.getItem('simai.admin.appearance') || '{}'); } catch (error) { chosen = {}; }
        var lang = chosen.lang === 'en' ? 'en' : 'ru';
        document.documentElement.lang = lang;
        var theme = chosen.theme || 'system';
        var dark = theme === 'dark'
          || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('theme-dark', dark);
        document.documentElement.classList.toggle('theme-light', !dark);
      })();
    </script>
    <script>
      window.SF_BOOT_CONFIG = {
        icons: { enabled: false, accumulate: false },
        cacheVersion: 'navigation-menu-reference-v3',
      };
      window.sfPath = '/distr/';
      window.sfSmartPath = '/distr/';
    </script>
    <script>
      // The four components this reference is built on -- sf-view-table,
      // sf-view, sf-view-properties and sf-admin-menu -- are SIMAI Pro's, the
      // component package pro, and reach the page through the Loader:
      // it fetches <base>/rule.js before its first scan and loads them from
      // that base. Their rules are gone from the free core, so a page that does
      // not declare this renders nothing. The base is a placeholder here and the
      // build stamps the package's id into it, so a new package build lands on a
      // path no cache can answer with the previous build's bytes.
      window.SF_BOOT_CONFIG = {
        ...window.SF_BOOT_CONFIG,
        packages: { pro: { base: '/distr-pro/' } },
      };
    </script>
    <script
      src="/distr/core/js/core.js"
      data-sf-script="/distr/core/js/core.js"></script>
  </head>
  <body class="flex h-full">
    <!-- The menu alone, over the navigation port (src/navigation.ts and
         src/ports/navigation-host.mjs over data/navigation.json): no rows in
         the markup, they are the host's. The page beside it is empty. -->
    <aside class="admin-navigation h-full navigation-reference" data-navigation-reference="sf-direct">
      <sf-admin-menu id="navigation-reference-menu" class="h-full" aria-label="Admin navigation reference" data-sf-skeleton="menu"></sf-admin-menu>
    </aside>
    <script type="module" src="/src/navigation-menu-reference.ts"></script>
  </body>
</html>
